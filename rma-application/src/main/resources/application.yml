spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rma_db}
    username: ${DB_USERNAME:rma}
    password: ${DB_PASSWORD:rma}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/return_management
      - classpath:db/migration/payment_integration
      - classpath:db/migration/identity_access
    schemas:
      - return_management
      - payment_integration
      - identity_access
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: rma-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  expiration-ms: 86400000

payu:
  base-url: https://secure.snd.payu.com
  pos-id: 300746
  md5-key: b6ca15b0d1020e8094d9b5f8d9285b92
  oauth-client-id: 300746
  oauth-client-secret: 2ee86a66e5d97e3fadc400c9f19b065d

courier:
  inpost:
    base-url: https://api-shipx-pl.easypack24.net
    api-key: ${INPOST_API_KEY:sandbox-api-key}
    organization-id: ${INPOST_ORG_ID:12345}
  dpd:
    base-url: https://dpdservices.dpd.com.pl
    login: ${DPD_LOGIN:neopak}
    password: ${DPD_PASSWORD:sandbox-pass}
    fid: ${DPD_FID:1234}
