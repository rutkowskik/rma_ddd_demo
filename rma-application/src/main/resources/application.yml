spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rma_db}
    username: ${DB_USERNAME:rma}
    password: ${DB_PASSWORD:rma}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/return_management
      - classpath:db/migration/payment_integration
      - classpath:db/migration/identity_access
    schemas:
      - return_management
      - payment_integration
      - identity_access
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: rma-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  expiration-ms: 86400000
