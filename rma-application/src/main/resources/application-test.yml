spring:
  datasource:
    url: jdbc:tc:postgresql:16:///rma_db
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/return_management
      - classpath:db/migration/payment_integration
      - classpath:db/migration/identity_access
    schemas:
      - return_management
      - payment_integration
      - identity_access
    baseline-on-migrate: true
