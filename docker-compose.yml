version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: rma_postgres
    environment:
      POSTGRES_DB: rma_db
      POSTGRES_USER: rma
      POSTGRES_PASSWORD: rma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rma -d rma_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
